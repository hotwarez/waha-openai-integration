version: "3.8"

services:
  bridge:
    image: ghcr.io/hotwarez/waha-openai:latest
    ports:
      - "8080:8080"
    environment:
      - PORT=8080
      - WAHA_URL
      - WAHA_TOKEN
      - OPENAI_API_KEY
      - OPENAI_ASSISTANT_ID
      - USE_RESPONSES_API=false
    restart: unless-stopped
    volumes:
      - waha_threads:/app/threads

volumes:
  waha_threads:
