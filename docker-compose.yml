version: "3.8"

services:
  bridge:
    build: .
    image: waha-openai-bridge:local
    ports:
      - "8080:8080"
    environment:
      - WAHA_URL=http://waha:8000
      - WAHA_TOKEN=
      - OPENAI_API_KEY=${OPENAI_API_KEY}
      - OPENAI_ASSISTANT_ID=${OPENAI_ASSISTANT_ID}
      - USE_RESPONSES_API=false
    restart: unless-stopped
    volumes:
      - ./threads:/app/threads
