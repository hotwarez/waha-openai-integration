version: "3.8"

services:
  bridge:
    image: ghcr.io/hotwarez/waha-openai:latest
    ports:
      - "8085:8080"
    environment:
      - PORT=8080
      - ADMIN_PASSWORD=admin
    restart: unless-stopped
    volumes:
      - saas_threads:/app/threads
      - saas_data:/app/data

volumes:
  saas_threads:
  saas_data:
