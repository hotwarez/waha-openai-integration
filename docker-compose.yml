version: "3.8"

services:
  bridge:
    image: ghcr.io/hotwarez/waha-openai:latest
    ports:
      - "8080:8080"
    environment:
      - PORT=8080
      - ADMIN_PASSWORD=admin
      - USE_RESPONSES_API=false
    restart: unless-stopped
    volumes:
      - ./threads:/app/threads
      - ./data:/app/data
